[project]
name = "plexus"
version = "0.1.0"
description = "Goal decomposition + acceptance loop on top of heart/arteries/capillaries"
requires-python = ">=3.11"

[project.scripts]
plexus = "plexus.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plexus = ["static/*", "static/assets/*"]

# heart is a hard runtime requirement (plexus dispatches every feature through
# it) but isn't on PyPI, so the bare name would resolve to a stranger's package.
# Same arrangement as arteries -> capillaries: declared in the default uv group
# and pinned to the sibling checkout, which is where it sits in a standalone
# clone and in the vascular umbrella alike.
[dependency-groups]
dev = [
    "heart",
    "pytest>=8.0",
]

[tool.uv.sources]
heart = { path = "../heart", editable = true }

[tool.pytest.ini_options]
# Import this checkout's source, not an installed copy. The sandbox image has
# heart pip-installed at /opt/heart, so without this a verifier ran heart's
# suite against the image's stale heart and failed collection -- every
# sandboxed heart feature was judged on code it didn't contain. Same reasoning
# as capillaries' pin, for the same worktree case.
pythonpath = ["src"]
